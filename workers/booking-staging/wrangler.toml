# AURMOVA isolated customer-booking staging Worker.
# This configuration intentionally does not reference the production Worker.
name = "aurmova-booking-staging"
main = "index.js"
compatibility_date = "2026-10-16"
workers_dev = true

# Only the independent booking-staging D1 database is configured below.
# Keep OWNER_ADMIN_KEY, TURNSTILE_SECRET_KEY and RATE_LIMIT_SALT in Cloudflare
# encrypted runtime secrets, not this GitHub file.

# Public Turnstile widget key. Never place the secret key in GitHub.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFYcY4uTYljOjRVA"

[[d1_databases]]
binding = "DB"
database_name = "aurmova-booking-staging"
database_id = "68dcbf69-cb79-4dbb-94d1-4e9e33bfd036"
# Staging-only CI refresh: trigger Cloudflare Builds for isolated booking Worker; keep main untouched.
